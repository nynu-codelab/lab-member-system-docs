<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Lab Member System banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="220" rx="18" fill="url(#bg)"/>
  <rect x="0" y="202" width="880" height="18" rx="0" fill="url(#accent)" opacity="0.9"/>

  <!-- corner brackets -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M 36 44 v -14 h 14"/>
    <path d="M 844 44 v -14 h -14"/>
    <path d="M 36 176 v 14 h 14"/>
    <path d="M 844 176 v 14 h -14"/>
  </g>

  <!-- user rows motif -->
  <g opacity="0.55">
    <rect x="72" y="96" width="46" height="10" rx="5" fill="#334155"/>
    <rect x="72" y="114" width="30" height="10" rx="5" fill="#334155"/>
  </g>
  <g opacity="0.55">
    <rect x="762" y="96" width="46" height="10" rx="5" fill="#334155"/>
    <rect x="778" y="114" width="30" height="10" rx="5" fill="#334155"/>
  </g>

  <text x="440" y="102" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="700" fill="#f8fafc">实验室成员管理系统</text>
  <text x="440" y="140" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="19" fill="#94a3b8">CodeLab 新人入门项目 · Lab Member System</text>
  <text x="440" y="172" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#14b8a6">需求 → 数据库 → 接口 → 测试 → 验收交付</text>
</svg>
